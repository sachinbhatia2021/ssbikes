<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Solset - Login</title>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" 
    integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" 
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./html.css">
  <link rel="icon" type="image/x-icon" href="../static/logo.jpeg">

  <style>
    /* ===== General Styles ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
    body { background: #f0f0f0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }

    /* ===== Container ===== */
    .container {
      width: 90%;
      max-width: 1000px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(117, 110, 110, 0.1);
      overflow: hidden;
      display: flex;
      flex-wrap: wrap;
    }

    /* ===== Form Section ===== */
    .forms-container { flex: 1; padding: 40px; display: flex; align-items: center; justify-content: center; }

    form { width: 100%; max-width: 350px; display: flex; flex-direction: column; }
    .title { font-size: 2rem; font-weight: 600; margin-bottom: 1rem; text-align: center; color: #333; }

    .input-field {
      background: #f0f0f0;
      margin: 10px 0;
      height: 50px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      padding: 0 10px;
    }
    .input-field i { color: #aaa; margin-right: 10px; font-size: 1.1rem; cursor: pointer; }
    .input-field input { border: none; outline: none; background: none; width: 100%; font-size: 1rem; }

    .btn {
      margin-top: 15px;
      background: #8f8e8f;
      color: #fff;
      border: none;
      border-radius: 5px;
      height: 45px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn:hover { background: #2e2e2e; }

    /* ===== Panels ===== */
    .panels-container { flex: 1; position: relative; background: linear-gradient(135deg, #5a595a, #b6b5b6); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; color: #fff; }
    .panels-container img { max-width: 250px; margin-bottom: 20px; border-radius: 10px; }
    .panels-container h1 { font-size: 2rem; margin-bottom: 10px; }
    .panels-container p { font-size: 1rem; }

    /* ===== Responsive ===== */
    @media (max-width: 900px) {
      .container { flex-direction: column; }
      .panels-container { order: -1; width: 100%; padding: 30px; text-align: center; }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- ===== Login Form ===== -->
    <div class="forms-container">
      <form action="{{ url_for('index') }}" method="POST">
        <h2 class="title">Login</h2>
        {% if error %}<p style="color:red;text-align:center;">{{ error }}</p>{% endif %}
        {% if message %}<p style="color:blue;text-align:center;">{{ message }}</p>{% endif %}

        <div class="input-field">
          <i class="fa-solid fa-user"></i>
          <input type="text" name="username" placeholder="Username" required>
        </div>

        <div class="input-field">
          <i class="fas fa-lock" id="togglePassword"></i>
          <input type="password" name="password" id="password" placeholder="Password" required>
        </div>

        <button type="submit" class="btn">Login</button>
      </form>
    </div>

    <!-- ===== Panel Section ===== -->
    <div class="panels-container">
      <img src="../static/logossbike.png" alt="Logo">
      <h1>Welcome to SS Bikes</h1>
    </div>
  </div>

  <!-- ===== Scripts ===== -->
  <script>
    const password = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    togglePassword.addEventListener('click', () => {
      const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
      password.setAttribute('type', type);
      togglePassword.classList.toggle('fa-lock');
      togglePassword.classList.toggle('fa-lock-open');
    });
  </script>
</body>
</html>
